<!doctype html>
<html lang="zh-Hant" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>風格提案 B：扣款看板｜刷哪張</title>
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#121417" />
    <style>
      :root {
        --bg: #121417;
        --panel: #1b1f26;
        --panel-2: #23272f;
        --line: #343a45;
        --ink: #eef1f5;
        --ink-soft: #9aa3b2;
        --accent: #f0b429;
        --accent-ink: #121417;
        --gain: #5fd0a1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        line-height: 1.55;
      }

      .num {
        font-family: "SF Mono", "Consolas", "Menlo", monospace;
        font-variant-numeric: tabular-nums;
      }

      .app {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      @media (min-width: 480px) {
        .app {
          padding: 24px;
        }
      }

      .app-header h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .app-header .tagline {
        margin: 2px 0 0;
        font-size: 0.85rem;
        color: var(--ink-soft);
      }

      .query-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
      }

      .query-row {
        display: flex;
        gap: 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }

      label {
        font-size: 0.78rem;
        color: var(--ink-soft);
      }

      input {
        font: inherit;
        font-size: 1rem;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--ink);
        min-width: 0;
      }

      select,
      input {
        color-scheme: dark;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }

      button {
        touch-action: manipulation;
      }

      .query-row button {
        flex: 0 0 auto;
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        min-height: 44px;
      }

      .toolbar {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        font-size: 0.85rem;
      }

      .toolbar .field {
        flex: 0 1 140px;
      }

      fieldset {
        border: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      fieldset legend {
        font-size: 0.78rem;
        color: var(--ink-soft);
        padding: 0;
      }

      fieldset label {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 44px;
      }

      /* 第 1 名：看板主格 */
      .board {
        background: var(--panel);
        border: 2px solid var(--accent);
        border-radius: 8px;
        padding: 16px;
      }

      .board-rank {
        display: inline-block;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        font-size: 0.8rem;
        padding: 3px 10px;
        border-radius: 4px;
      }

      .board h2 {
        margin: 10px 0 2px;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .board-rate-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-top: 4px;
        flex-wrap: wrap;
      }

      .board-rate {
        font-size: 3rem;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
      }

      .board-cap {
        color: var(--ink-soft);
        font-size: 0.9rem;
      }

      .board-reason {
        margin: 8px 0 0;
        font-size: 0.95rem;
      }

      .section-title {
        margin: 2px 0 0;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--ink-soft);
      }

      .rec-list {
        list-style: none;
        margin: 0;
        padding: 0;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--line);
      }

      .rec-row {
        display: grid;
        grid-template-columns: 1.8rem 1fr auto;
        gap: 6px 10px;
        align-items: baseline;
        padding: 10px 10px;
      }

      .rec-row:nth-child(odd) {
        background: var(--panel);
      }

      .rec-row:nth-child(even) {
        background: var(--panel-2);
      }

      .rec-row .rank {
        color: var(--ink-soft);
        font-size: 0.85rem;
      }

      .rec-row .rec-name {
        min-width: 0;
      }

      .rec-row .rec-name .bank {
        font-size: 0.75rem;
        color: var(--ink-soft);
        display: block;
      }

      .rec-row .rec-name .card {
        font-weight: 700;
        font-size: 0.92rem;
        overflow-wrap: break-word;
      }

      .rec-row .rec-rate {
        font-weight: 700;
        white-space: nowrap;
        text-align: right;
      }

      .rec-detail {
        grid-column: 1 / -1;
        font-size: 0.82rem;
        color: var(--ink-soft);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }

      .tag {
        background: rgba(240, 180, 41, 0.14);
        border: 1px solid rgba(240, 180, 41, 0.4);
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 0.75rem;
        color: var(--accent);
      }

      .rec-detail a {
        color: var(--accent);
        font-weight: 700;
      }

      .rec-gain {
        color: var(--gain);
      }

      .app-footer {
        font-size: 0.78rem;
        color: var(--ink-soft);
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }

      .app-footer p {
        margin: 2px 0;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>刷哪張</h1>
        <p class="tagline">輸入消費商家，依官方回饋規則排出這筆該刷哪張卡</p>
      </header>

      <section class="query-panel" aria-label="查詢條件">
        <form id="query-form">
          <div class="query-row">
            <div class="field">
              <label for="merchant-input">消費商家</label>
              <input id="merchant-input" type="text" value="全聯" autocomplete="off" />
            </div>
            <button type="button">查詢</button>
          </div>
          <div class="toolbar">
            <div class="field">
              <label for="amount-input">金額（選填）</label>
              <input id="amount-input" type="number" inputmode="numeric" value="1000" />
            </div>
            <fieldset>
              <legend>查詢範圍</legend>
              <label><input type="radio" name="scope" /> 我的卡片</label>
              <label><input type="radio" name="scope" checked /> 全部卡別</label>
            </fieldset>
          </div>
        </form>
      </section>

      <section aria-label="第 1 名推薦">
        <div id="top-card" class="board"></div>
      </section>

      <section aria-labelledby="rest-title">
        <h2 id="rest-title" class="section-title">其餘名次</h2>
        <ol id="rec-list" class="rec-list"></ol>
      </section>

      <footer class="app-footer">
        <p id="footer-checked-at"></p>
        <p>排序規則：只依這筆消費可得的回饋率由高到低排序，不收業配、不影響排序。</p>
        <p>本站資料僅供參考，實際回饋規則、活動期間與上限請以各銀行官方公告為準；如有疑義，請點擊「官方來源」核對原文。</p>
      </footer>
    </main>

    <script type="module">
      import { recommendations, footerCheckedAt } from "./data.mjs";

      function recMeta(rec, { includeReason = true, includeCap = false } = {}) {
        const p = document.createElement("p");
        p.className = "rec-detail";

        if (includeCap) {
          const cap = document.createElement("span");
          cap.className = "num";
          cap.textContent = rec.capText;
          p.appendChild(cap);
        }

        if (includeReason) {
          const reason = document.createElement("span");
          reason.textContent = rec.reason;
          p.appendChild(reason);
        }

        for (const condition of rec.conditions) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = condition;
          p.appendChild(tag);
        }

        if (typeof rec.estimatedAmount === "number") {
          const gain = document.createElement("span");
          gain.className = "rec-gain";
          gain.textContent = rec.capped
            ? `預估回饋約 ${rec.estimatedAmount} 元（已達上限）`
            : `預估回饋約 ${rec.estimatedAmount} 元`;
          p.appendChild(gain);
        }

        const link = document.createElement("a");
        link.href = rec.sourceUrl;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "官方來源";
        link.className = "num";
        p.appendChild(link);

        const checkedAt = document.createElement("span");
        checkedAt.className = "num";
        checkedAt.textContent = `檢核日期：${rec.checkedAt}`;
        p.appendChild(checkedAt);

        return p;
      }

      function renderTop(rec) {
        const wrap = document.getElementById("top-card");

        const badge = document.createElement("p");
        badge.className = "board-rank";
        badge.textContent = "No.1";
        wrap.appendChild(badge);

        const title = document.createElement("h2");
        title.textContent = rec.plan
          ? `${rec.bankName}　${rec.cardName}（${rec.plan}）`
          : `${rec.bankName}　${rec.cardName}`;
        wrap.appendChild(title);

        const rateRow = document.createElement("div");
        rateRow.className = "board-rate-row";
        const rate = document.createElement("span");
        rate.className = "board-rate num";
        rate.textContent = rec.rateText;
        const cap = document.createElement("span");
        cap.className = "board-cap num";
        cap.textContent = rec.capText;
        rateRow.appendChild(rate);
        rateRow.appendChild(cap);
        wrap.appendChild(rateRow);

        const reason = document.createElement("p");
        reason.className = "board-reason";
        reason.textContent = rec.reason;
        wrap.appendChild(reason);

        wrap.appendChild(recMeta(rec, { includeReason: false }));
      }

      function renderRow(rec, rank) {
        const li = document.createElement("li");
        li.className = "rec-row";

        const rankEl = document.createElement("span");
        rankEl.className = "rank num";
        rankEl.textContent = String(rank);
        li.appendChild(rankEl);

        const name = document.createElement("div");
        name.className = "rec-name";
        const bank = document.createElement("span");
        bank.className = "bank";
        bank.textContent = rec.bankName;
        const card = document.createElement("span");
        card.className = "card";
        card.textContent = rec.plan ? `${rec.cardName}（${rec.plan}）` : rec.cardName;
        name.appendChild(bank);
        name.appendChild(card);
        li.appendChild(name);

        const rate = document.createElement("span");
        rate.className = "rec-rate num";
        rate.textContent = rec.rateText;
        li.appendChild(rate);

        li.appendChild(recMeta(rec, { includeCap: true }));
        return li;
      }

      const [top, ...rest] = recommendations;
      renderTop(top);

      const list = document.getElementById("rec-list");
      rest.forEach((rec, i) => list.appendChild(renderRow(rec, i + 2)));

      document.getElementById("footer-checked-at").textContent = `資料最後檢核日期：${footerCheckedAt}`;
    </script>
  </body>
</html>
